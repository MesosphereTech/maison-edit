    header,main,footer{width:min(1120px,calc(100% - 48px));margin:auto}

    .frame{background:#102b25;padding:8px;border:1px solid #315348;border-radius:4px;box-shadow:0 16px 48px #173d3418}
    video{display:block;width:100%;aspect-ratio:16/9;background:#102b25}
    .details{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:13px}
    .download{display:inline-block;padding:13px 20px;border:1px solid var(--ink);text-decoration:none;border-radius:2px}.download:hover{background:var(--ink);color:var(--paper)}
    footer{border-top:1px solid var(--line);padding:23px 0 32px;color:#526458;font-size:11px;letter-spacing:.08em}
    @media(max-width:560px){header,main,footer{width:calc(100% - 32px)}header{align-items:flex-start}.brand{font-size:18px}main{padding-top:36px}.back{font-size:12px}}
